# MusicMC — NeoForge mod metadata.
#
# Format aligned with the neoforge.mods.toml inside the ModernUI-NeoForge
# 26.1.2-3.13.0.5 jar (verified by unzip): modLoader="javafml" /
# loaderVersion="[2,)" / top-level license / ''' multiline description.
# displayTest: not used (default IGNORE_ALL_VERSION), same as ModernUI official jar.
# Version is hardcoded (mod_version=0.1.0, maintained in root gradle.properties).
modLoader="javafml"
loaderVersion="[2,)"
license="GPL-3.0"

[[mods]]
    modId="musicmc"
    version="0.1.0"
    displayName="MusicMC"
    description='''
    Listen to Bilibili music inside Minecraft. Song search, playlists,
    lyrics, HUD overlay and local config management. The UI backend is
    picked automatically (ModernUI / YACL; Android always uses YACL).
    '''

[[dependencies.musicmc]]
    modId="minecraft"
    type="required"
    versionRange="[26.1,26.3)"
    ordering="NONE"
    side="BOTH"

[[dependencies.musicmc]]
    modId="neoforge"
    type="required"
    versionRange="[26.1.0.1-beta,)"
    ordering="NONE"
    side="BOTH"

# ModernUI is optional (used when installed; not usable on Android since it
# depends on Java2D, auto-falls back to YACL)
[[dependencies.musicmc]]
    modId="modernui"
    type="optional"
    versionRange="[3.13.0.5,)"
    ordering="AFTER"
    side="BOTH"

# YACL is a required runtime dependency (config screen + modern UI on
# Android / Fabric without ModernUI; modId matches the YACL jar's toml)
[[dependencies.musicmc]]
    modId="yet_another_config_lib_v3"
    type="required"
    versionRange="[3.9.6,)"
    ordering="AFTER"
    side="BOTH"
