# =============================================================================
# 手动触发:构建 fabric/neoforge mod jar(跳过 native 平台重编)。
#   nativePlatform=linux-x86_64(默认):单平台,原生库走 project(":native") 由 Gradle 构建;
#   nativePlatform=all:全平台打包,要求 native/build/libs 下 7 个文件存在
#     (6 个 musicmc-native-*.jar + musicmc-javacpp-windows-arm64.jar)。
#     7 个文件的来源:填 native_run_id → 用 dawidd6/action-download-artifact 下载
#     native-build 工作流该 run 的 6 个平台 jar;第 7 个 javacpp-windows-arm64.jar
#     非 CI 产物,随仓库 native/toolbox/ 提供 → 复制到 native/build/libs。
#     两者缺任一 → 步骤显式报错(不等到 Gradle 才失败)。
# =============================================================================
name: build-mod

on:
  workflow_dispatch:
    inputs:
      nativePlatform:
        description: 原生平台打包模式(linux-x86_64=单平台 / all=全部 6 平台)
        type: choice
        options:
          - linux-x86_64
          - all
        default: linux-x86_64
      native_run_id:
        description: 可选。native-build 工作流的 run id;all 模式用它下载 6 个平台 jar 到 native/build/libs/
        type: number
        required: false

jobs:
  build:
    name: build mod (-PnativePlatform=${{ github.event.inputs.nativePlatform }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # all 模式:从指定的 native-build run 下载 6 个平台 jar(与 native-build.yml 的
      # assemble-all 同来源)。不填 native_run_id 时跳过下载 —— 但 native/build/ 被
      # .gitignore 排除,仓库内不可能预置,故 all 模式实际必须给 native_run_id。
      - name: Download native platform jars (all mode)
        if: github.event.inputs.nativePlatform == 'all' && github.event.inputs.native_run_id != ''
        uses: dawidd6/action-download-artifact@v6
        with:
          run_id: ${{ github.event.inputs.native_run_id }}
          name: musicmc-native-*
          path: native/build/libs

      # all 模式第 7 个文件(musicmc-javacpp-windows-arm64.jar):从 native/toolbox/ 补
      - name: Ensure javacpp windows-arm64 jar (all mode)
        if: github.event.inputs.nativePlatform == 'all'
        run: |
          mkdir -p native/build/libs
          if [ ! -f native/build/libs/musicmc-javacpp-windows-arm64.jar ]; then
            if [ -f native/toolbox/musicmc-javacpp-windows-arm64.jar ]; then
              cp native/toolbox/musicmc-javacpp-windows-arm64.jar native/build/libs/
            else
              echo "::error::缺少 native/build/libs/musicmc-javacpp-windows-arm64.jar"
              echo "::error::(all 模式需 7 个文件;请放入 native/toolbox/ 并提交仓库)"
              exit 1
            fi
          fi

      # all 模式完整性检查:7 个文件缺一即在此报错(提示填 native_run_id)
      - name: Verify native libs (all mode)
        if: github.event.inputs.nativePlatform == 'all'
        run: |
          cd native/build/libs
          missing=""
          for f in musicmc-native-linux-x86_64.jar musicmc-native-linux-arm64.jar \
                   musicmc-native-windows-x86_64.jar musicmc-native-windows-arm64.jar \
                   musicmc-native-android-arm64.jar musicmc-native-android-x86_64.jar \
                   musicmc-javacpp-windows-arm64.jar; do
            [ -f "$f" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "::error::all 模式缺文件:$missing"
            echo "::error::请提供 native_run_id(指向 native-build 工作流的一次成功 run)或本地补齐 native/build/libs/"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      # 单平台(linux-x86_64):fabric/neoforge 依赖 project(":native") → Gradle 自动触发
      # 原生构建;all 模式:仅打包,不触发 native 重建(与 README 描述一致)
      - name: Build mod jars
        run: ./gradlew :fabric:build :neoforge:build -PnativePlatform=${{ github.event.inputs.nativePlatform }} --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: mod-fabric-${{ github.event.inputs.nativePlatform }}
          path: fabric/build/libs/musicmc-fabric-*.jar
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: mod-neoforge-${{ github.event.inputs.nativePlatform }}
          path: neoforge/build/libs/musicmc-neoforge-*.jar
          if-no-files-found: error
          retention-days: 14