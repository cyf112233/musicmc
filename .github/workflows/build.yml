# =============================================================================
# 单工作流:从零编译 6 平台原生库(FFmpeg + javacpp JNI + AAudio)→ 全平台 mod jar
# → 自动创建 GitHub Release 并上传产物(push)。
#
#   native   job:6 平台并行,完整 cppbuild + javacpp Builder(bash native/build.sh),
#              含各平台交叉工具链(linux-arm64 g++ / windows-x86_64 mingw /
#              windows-arm64 llvm-mingw / android NDK)+ cppbuild 编译缓存。
#   assemble job:汇总 6 个 native 平台 jar + toolbox 的 javacpp-windows-arm64.jar
#              → ./gradlew -PnativePlatform=all 打全平台 fabric/neoforge mod jar。
#   release  job:把 2 个 mod jar 上传为 GitHub Release(push 产物)。
#
# 触发:手动(workflow_dispatch)或 push main/master;native/** 变更也会全量重编。
# =============================================================================
name: build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - 'README.md'
      - 'docs/**'

jobs:
  native:
    name: native ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux-x86_64
          - linux-arm64
          - windows-x86_64
          - windows-arm64
          - android-arm64
          - android-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # build.sh 默认从 native/toolbox/ 读取两个 bytedeco jar;缺失时从 Maven Central 补
      - name: Ensure toolbox jars
        run: |
          mkdir -p native/toolbox
          [ -f native/toolbox/ffmpeg-7.1.1-1.5.12.jar ] || \
            curl -fL -o native/toolbox/ffmpeg-7.1.1-1.5.12.jar \
              https://repo1.maven.org/maven2/org/bytedeco/ffmpeg/7.1.1-1.5.12/ffmpeg-7.1.1-1.5.12.jar
          [ -f native/toolbox/javacpp-1.5.12.jar ] || \
            curl -fL -o native/toolbox/javacpp-1.5.12.jar \
              https://repo1.maven.org/maven2/org/bytedeco/javacpp/1.5.12/javacpp-1.5.12.jar
          ls -la native/toolbox/*.jar

      # ---- 平台工具链准备 ----
      - name: Install aarch64-linux-gnu cross toolchain
        if: matrix.platform == 'linux-arm64'
        run: sudo apt-get install -y g++-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Install mingw-w64 cross toolchain
        if: matrix.platform == 'windows-x86_64'
        run: sudo apt-get install -y g++-mingw-w64-x86-64

      # windows-arm64:llvm-mingw 交叉工具链(aarch64-w64-mingw32-g++ 等)
      - name: Restore llvm-mingw cache
        if: matrix.platform == 'windows-arm64'
        uses: actions/cache@v4
        with:
          path: ~/llvm-mingw
          key: llvm-mingw-20260616

      - name: Install llvm-mingw
        if: matrix.platform == 'windows-arm64'
        run: |
          if [ ! -x "$HOME/llvm-mingw/bin/aarch64-w64-mingw32-g++" ]; then
            mkdir -p "$HOME/llvm-mingw"
            curl -fL -o /tmp/llvm-mingw.tar.xz \
              https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/llvm-mingw-20260616-msvcrt-ubuntu-22.04-x86_64.tar.xz
            tar -xJf /tmp/llvm-mingw.tar.xz -C "$HOME/llvm-mingw" --strip-components=1
            rm -f /tmp/llvm-mingw.tar.xz
          fi
          echo "LLVM_MINGW_DIR=$HOME/llvm-mingw" >> "$GITHUB_ENV"
          echo "REAL_GPP=$HOME/llvm-mingw/bin/aarch64-w64-mingw32-g++" >> "$GITHUB_ENV"
          echo "$HOME/llvm-mingw/bin" >> "$GITHUB_PATH"

      # android:NDK r27b
      - name: Restore Android NDK cache
        if: startsWith(matrix.platform, 'android-')
        uses: actions/cache@v4
        with:
          path: ~/android-ndk-r27b
          key: android-ndk-r27b

      - name: Install Android NDK
        if: startsWith(matrix.platform, 'android-')
        run: |
          if [ ! -x "$HOME/android-ndk-r27b/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]; then
            curl -fL -o /tmp/android-ndk-r27b-linux.zip \
              https://dl.google.com/android/repository/android-ndk-r27b-linux.zip
            unzip -q /tmp/android-ndk-r27b-linux.zip -d "$HOME"
            rm -f /tmp/android-ndk-r27b-linux.zip
          fi
          echo "ANDROID_NDK=$HOME/android-ndk-r27b" >> "$GITHUB_ENV"

      # ---- cppbuild 缓存(FFmpeg 编译树,命中即跳过阶段 1;键含脚本 hash 自动失效)----
      - name: Compute cppbuild cache hash
        run: echo "cppbuild_hash=$(sha256sum native/cppbuild/ffmpeg/cppbuild.sh | cut -c1-8)" >> "$GITHUB_ENV"

      - name: Restore cppbuild cache
        uses: actions/cache@v4
        with:
          path: native/cppbuild/ffmpeg/cppbuild/${{ matrix.platform }}
          key: cppbuild-${{ matrix.platform }}-ffmpeg-7.1.5-${{ env.cppbuild_hash }}

      # ---- 两阶段构建(从零编译:cppbuild FFmpeg + javacpp Builder + AAudio)----
      - name: Build native ${{ matrix.platform }}
        run: |
          mkdir -p native/build
          if ! bash native/build.sh "${{ matrix.platform }}" > native/build/native-${{ matrix.platform }}.log 2>&1; then
            echo "::group::build.sh tail(-last 150 lines)"
            tail -n 150 native/build/native-${{ matrix.platform }}.log
            echo "::endgroup::"
            exit 1
          fi
          tail -n 5 native/build/native-${{ matrix.platform }}.log

      # windows 产物归一化(.so 后缀 PE → .dll;ffmpeg dll 从 cppbuild bin 复制;arm64 附 libc++)
      - name: Normalize Windows DLL layout
        if: startsWith(matrix.platform, 'windows-')
        run: |
          cd "native/build/native/${{ matrix.platform }}"
          OUT="org/bytedeco/ffmpeg/${{ matrix.platform }}"
          for f in "$OUT"/libjni*.so; do mv -f "$f" "${f%.so}.dll"; done
          SRC="../../../cppbuild/ffmpeg/cppbuild/${{ matrix.platform }}/bin"
          cp "$SRC"/avcodec-61.dll "$SRC"/avformat-61.dll "$SRC"/avutil-59.dll "$SRC"/swresample-5.dll "$OUT"/
          if [ "${{ matrix.platform }}" = "windows-arm64" ]; then
            cp "$LLVM_MINGW_DIR/aarch64-w64-mingw32/bin/libc++.dll" \
               "$LLVM_MINGW_DIR/aarch64-w64-mingw32/bin/libunwind.dll" "$OUT"/
          fi
          ls -la "$OUT"

      # 打平台 jar(等价 :native:packageNative:from build/native/<platform> JAR 到 libs/)
      - name: Package platform jar
        run: |
          mkdir -p native/build/libs
          cd "native/build/native/${{ matrix.platform }}"
          jar cf "../../libs/musicmc-native-${{ matrix.platform }}.jar" org
          ls -la ../../libs

      - uses: actions/upload-artifact@v4
        with:
          name: musicmc-native-${{ matrix.platform }}
          path: native/build/libs/musicmc-native-${{ matrix.platform }}.jar
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: assemble (mod jars, 6 platforms)
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: musicmc-native-*
          merge-multiple: true
          path: native/build/libs

      # all 模式第 7 个文件 musicmc-javacpp-windows-arm64.jar 非 CI 产物
      # (bytedeco 1.5.12 无 windows-arm64 坐标,libjnijavacpp.dll 无法从公开源重建),
      # 随仓库 native/toolbox/ 提供。
      - name: Ensure javacpp windows-arm64 jar
        run: |
          mkdir -p native/build/libs
          if [ ! -f native/build/libs/musicmc-javacpp-windows-arm64.jar ]; then
            if [ -f native/toolbox/musicmc-javacpp-windows-arm64.jar ]; then
              cp native/toolbox/musicmc-javacpp-windows-arm64.jar native/build/libs/
            else
              echo "::error::缺少 native/build/libs/musicmc-javacpp-windows-arm64.jar"
              echo "::error::(all 模式第 7 个必需文件;请放入 native/toolbox/ 并提交仓库)"
              exit 1
            fi
          fi
          ls -la native/build/libs/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      # launchermeta.mojang.com 双栈 DNS:Java 25 可能先试 IPv6 而 runner 无 IPv6 出口,
      # preferIPv4Stack=true 强制 IPv4 规避(2026-08-19 实测)。
      - name: Build mod jars (all platforms)
        env:
          JAVA_TOOL_OPTIONS: -Djava.net.preferIPv4Stack=true
        run: ./gradlew :fabric:build :neoforge:build -PnativePlatform=all --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: mod-fabric-all
          path: fabric/build/libs/musicmc-fabric-*.jar
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: mod-neoforge-all
          path: neoforge/build/libs/musicmc-neoforge-*.jar
          if-no-files-found: error
          retention-days: 14

  release:
    name: release (push mod jars)
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: mod-*
          merge-multiple: true
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build #${{ github.run_number }}
          body: |
            自动构建产物(6 平台原生库 + 全平台 mod jar):
            - `musicmc-fabric-*.jar`
            - `musicmc-neoforge-*.jar`

            前置:需自行安装 YACL(`yet_another_config_lib_v3`)。
          files: release/*
          generate_release_notes: false
