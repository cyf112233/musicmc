org.gradle.jvmargs=-Xmx4G -Djava.net.preferIPv6Addresses=true
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

minecraft_version=26.1.2
mod_version=0.1.0
maven_group=io.github.cyf112233.musicmc
archives_base_name=musicmc

# FFmpeg 原生库目标平台(见 native/STATUS.md;构建命令 :native:buildNative / :native:packageNative)
nativePlatform=linux-x86_64

# FFmpeg 解码引擎(播放器主引擎):bytedeco 绑定 API + javacpp 运行时
# (原生 .so 由 native 模块平台 jar 提供,不经由此处的 javacpp 平台依赖;
# javacpp 平台 jar(提供 libjnijavacpp.so)由 fabric/neoforge 按 nativePlatform 打入)
ffmpeg_api_version=7.1.1-1.5.12
javacpp_version=1.5.12

loom_version=1.17.19
fabric_loader_version=0.19.3
fabric_api_version=0.155.2+26.1.2
fabric_kotlin_version=1.13.13+kotlin.2.4.10

neoforge_version=26.1.2.95
moddev_gradle_version=2.0.144

kotlin_version=2.4.0

modernui_mc_version=26.1.2-3.13.0.5
modernui_core_version=3.13.0
markflow_version=3.13.0
forgeconfigapiport_version=26.1.3

gson_version=2.13.2
# 二维码生成(扫码登录 UI 用;core 无运行期传递依赖)
zxing_version=3.5.4
